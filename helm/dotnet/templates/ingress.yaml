apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dotnet.chartName" . }}-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - {{ .Values.ingress.host }}  # Replace with your actual domain
      secretName: tls-secret  # TLS secret to hold SSL cert
  rules:
    - host: {{ .Values.ingress.host }}  # Replace with your actual domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "dotnet.chartName" . }}
                port:
                  number: 81
